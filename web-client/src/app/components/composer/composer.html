<form class="composer" [formGroup]="form" (ngSubmit)="onSubmit()" aria-label="Message composer">
  <div class="composer-row">
    <button
      id="composer-attach"
      type="button"
      class="attach-btn"
      (click)="openFilePicker()"
      aria-label="Attach files (uploaded on send)"
      title="Attach files (uploaded on send)"
      [disabled]="sendDisabled()"
    >
      <svg lucidePaperclip [size]="16" aria-hidden="true"></svg>
    </button>
    <textarea
      #textarea
      id="composer-input"
      formControlName="message"
      placeholder="Talk to ICOS..."
      autocomplete="off"
      autofocus
      rows="2"
      [disabled]="busy()"
      (keydown)="onKeydown($event)"
      aria-label="Message"
    ></textarea>
    <button id="composer-send" type="submit" [disabled]="sendDisabled()">
      <svg lucideSend [size]="16" aria-hidden="true"></svg>
      {{ sendLabel() }}
    </button>
  </div>
  <input
    #fileInput
    type="file"
    class="visually-hidden"
    multiple
    accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain,text/markdown,application/json"
    (change)="onFilesSelected($event)"
    aria-label="Choose files to attach"
    tabindex="-1"
  />
  @if (attachments().length > 0) {
    <div class="attachments" aria-label="Selected attachments">
      <ul aria-label="Attached files">
        @for (file of attachments(); track $index; let i = $index) {
          <li>
            <span>{{ file.name }}</span>
            <button
              type="button"
              (click)="removeAttachment(i)"
              [attr.aria-label]="'Remove attachment ' + file.name"
            >
              <svg lucideX [size]="14" aria-hidden="true"></svg>
            </button>
          </li>
        }
      </ul>
    </div>
  }
  @if (uploadError(); as error) {
    <p class="upload-error" role="alert">Attachment upload failed: {{ error }}</p>
  }
</form>
