<span
  class="gauge"
  [class.sm]="size() === 'sm'"
  [class.lg]="size() === 'lg'"
  [class.ok]="tone() === 'ok'"
  [class.warn]="tone() === 'warn'"
  [class.danger]="tone() === 'danger'"
  [class.idle]="tone() === 'idle'"
  [attr.role]="'img'"
  [attr.aria-label]="label()"
  [attr.title]="label()"
>
  <svg viewBox="0 0 36 36" aria-hidden="true">
    <circle class="track" cx="18" cy="18" r="15.9155"></circle>
    <circle
      class="value"
      cx="18"
      cy="18"
      r="15.9155"
      [attr.stroke-dasharray]="dash()"
    ></circle>
  </svg>
  <span class="pct mono">{{ used() === null ? '—' : percent() + '%' }}</span>
</span>
