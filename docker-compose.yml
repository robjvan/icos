services:
  # ---------------------------------------------------------------------------
  # ICOS v3 Core
  # ---------------------------------------------------------------------------
  core:
    build:
      context: ./core
      dockerfile: Dockerfile

    ports:
      - "3000:3000" # Temporary testing UI

    env_file:
      - ./core/.env

    volumes:
      # Single data root: sessions + memories + vector store + skills +
      # embedding model cache all live under the host's ~/.icos and
      # survive container rebuilds. Paths in core/.env must match the
      # container side exactly (bind mount, same absolute path).
      - /Users/rob/.icos:/Users/rob/.icos

    healthcheck:
      # Verify that NestJS is actually responding rather than merely having its process running.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (res) => [200, 404].includes(res.statusCode) ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ICOS v3 Angular web client
  # ---------------------------------------------------------------------------
  # Main application UI.
  #
  # This service waits for the core to become healthy before starting.
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile

    ports:
      - "4200:4200" # Angular

    depends_on:
      core:
        condition: service_healthy

    healthcheck:
      # Confirm that nginx is serving the SPA root document. (BusyBox wget:
      # the nginx:alpine image has no node for the old check.)
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:4200/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
