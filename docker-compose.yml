services:
  # ---------------------------------------------------------------------------
  # ICOS Core
  # ---------------------------------------------------------------------------
  core:
    build:
      context: ./core
      dockerfile: Dockerfile

    ports:
      # Loopback only by default: reachable from this machine, not the
      # LAN or the internet. To expose deliberately, see docs/security.md
      # and heed the boot warning (ICOS is not authenticated yet).
      - "127.0.0.1:3000:3000"

    environment:
      # Inside the container, bind all interfaces; the exposure boundary
      # is the port mapping above, which is loopback by default.
      HOST: 0.0.0.0

    env_file:
      - ./core/.env

    volumes:
      # Single data root: sessions + memories + vector store + skills +
      # embedding model cache all live under the host's ~/.icos and
      # survive container rebuilds. Paths in core/.env must match the
      # container side exactly (bind mount, same absolute path), so set
      # the SESSION_DB_PATH / MEMORY_DB_PATH / AUTH_DIR_PATH / ... values
      # in core/.env to ${HOME}/.icos/... .
      - ${HOME}/.icos:${HOME}/.icos

    healthcheck:
      # Verify that NestJS is actually responding rather than merely having its process running.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/core/health/live', (res) => (res.statusCode === 200) ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # ICOS Angular web client
  # ---------------------------------------------------------------------------
  # Main application UI.
  #
  # This service waits for the core to become healthy before starting.
  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile

    ports:
      # Loopback only by default (see docs/security.md).
      - "127.0.0.1:4200:4200" # Angular

    depends_on:
      core:
        condition: service_healthy

    healthcheck:
      # Confirm that nginx is serving the SPA root document. (BusyBox wget:
      # the nginx:alpine image has no node for the old check.)
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://localhost:4200/",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
