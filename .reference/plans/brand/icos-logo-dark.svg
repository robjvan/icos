<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <g id="icosMark">
      <rect x="-13" y="-64" width="26" height="118" rx="13" fill="#6F8F82"/>
      <circle cx="0" cy="-88" r="16" fill="#8A6D3B"/>
    </g>
  </defs>

  <rect width="960" height="680" fill="#25282A"/>

  <!-- header -->
  <text x="56" y="62" fill="#6F8F82" font-size="20" font-weight="600" letter-spacing="6">ICOS</text>
  <text x="56" y="88" fill="#8F958F" font-size="13">monogram · Exile Research palette · dark</text>

  <!-- palette legend -->
  <g transform="translate(620,40)">
    <rect width="16" height="16" rx="4" fill="#25282A" stroke="#3A3E40"/>
    <text x="22" y="13" fill="#8F958F" font-size="12">#25282A</text>
    <rect x="92" width="16" height="16" rx="4" fill="#6F8F82"/>
    <text x="114" y="13" fill="#8F958F" font-size="12">#6F8F82</text>
    <rect x="184" width="16" height="16" rx="4" fill="#8A6D3B"/>
    <text x="206" y="13" fill="#8F958F" font-size="12">#8A6D3B</text>
  </g>

  <!-- hero mark -->
  <use href="#icosMark" transform="translate(300,300) scale(1.9)"/>

  <!-- wordmark lockup -->
  <use href="#icosMark" transform="translate(600,266) scale(0.8)"/>
  <text x="652" y="268" fill="#6F8F82" font-size="60" font-weight="700" letter-spacing="3">ICOS</text>
  <text x="654" y="302" fill="#8F958F" font-size="15" letter-spacing="1">ISABEL Cognitive Operating System</text>

  <!-- sizes -->
  <text x="56" y="474" fill="#8F958F" font-size="13" letter-spacing="2">SCALE</text>
  <use href="#icosMark" transform="translate(120,552) scale(0.6)"/>
  <use href="#icosMark" transform="translate(215,552) scale(0.4)"/>
  <use href="#icosMark" transform="translate(290,552) scale(0.25)"/>
  <use href="#icosMark" transform="translate(345,552) scale(0.175)"/>
  <use href="#icosMark" transform="translate(395,552) scale(0.1)"/>
  <text x="120" y="600" fill="#6E7470" font-size="12" text-anchor="middle">96</text>
  <text x="215" y="600" fill="#6E7470" font-size="12" text-anchor="middle">64</text>
  <text x="290" y="600" fill="#6E7470" font-size="12" text-anchor="middle">40</text>
  <text x="345" y="600" fill="#6E7470" font-size="12" text-anchor="middle">28</text>
  <text x="395" y="600" fill="#6E7470" font-size="12" text-anchor="middle">16</text>

  <!-- app icon (inverted) -->
  <rect x="500" y="480" width="144" height="144" rx="32" fill="#6F8F82"/>
  <rect x="560" y="530" width="24" height="74" rx="12" fill="#25282A"/>
  <circle cx="572" cy="512" r="15" fill="#8A6D3B"/>
  <text x="572" y="648" fill="#6E7470" font-size="12" text-anchor="middle">app icon</text>

  <!-- on-light strip -->
  <rect x="56" y="612" width="848" height="48" rx="10" fill="#E4E4E7"/>
  <use href="#icosMark" transform="translate(120,636) scale(0.22)"/>
  <text x="160" y="641" fill="#4A4F4C" font-size="14">on lilac mist — the light brand background</text>
</svg>
