# ICOS — DMR override file (Docker Model Runner backend).
#
# NOT a standalone stack: it only holds the deltas versus
# docker-compose.yml (same service names, so values merge/replace).
#
#   DMR (extraction and chat served by Docker Model Runner):
#     docker compose -f docker-compose.yml -f docker-compose-dmr-local.yml up -d --build
#
# The two variants bind the same host ports (3000/4200), so bring one
# down before starting the other. Keeping a single file would force
# the 4.6 GB model pull onto every standard `up` — this split keeps
# the standard path lean and the AGENTS.md compose contract intact.
services:
  core:
    models:
      memory_llm:
        endpoint_var: MEMORY_LLM_BASE_URL
        model_var: MEMORY_LLM_MODEL
      chat_llm:
        endpoint_var: LLM_BASE_URL
        model_var: LLM_MODEL

    # .dmr.local.env mirrors .env except the memory and chat backends: the
    # MEMORY_LLM_* and LLM_* values arrive via the models block above, not the
    # file (see the note in core/.dmr.local.env).
    env_file:
      - ./core/.dmr.local.env

# ---------------------------------------------------------------------------
# Docker Model
# ---------------------------------------------------------------------------
models:
  memory_llm:
    model: hf.co/unsloth/gemma-4-E2B-it-GGUF:Q4_K_M
    context_size: 8192 # Memory model context window size

  chat_llm:
    model: hf.co/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
    context_size: 16384 # Chat model context window size
